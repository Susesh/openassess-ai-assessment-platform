# Cloud Build configuration for CI/CD pipeline
steps:
  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/openassess-backend:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/openassess-backend:latest', '.']
  
  # Push Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/openassess-backend:$COMMIT_SHA']
  
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/openassess-backend:latest']
  
  # Deploy to Cloud Run (production)
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'openassess-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/openassess-backend:$COMMIT_SHA'
      - '--platform'
      - 'managed'
      - '--region'
      - 'us-central1'
      - '--allow-unauthenticated'
      - '--cpu'
      - '2'
      - '--memory'
      - '4Gi'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '10'
      - '--port'
      - '8000'
      - '--set-env-vars'
      - 'DATABASE_URL=postgresql://openassess:password@//cloudsql/$PROJECT_ID:us-central1:openassess-db/openassess_db,GOOGLE_API_KEY=$$GOOGLE_API_KEY,SECRET_KEY=$$SECRET_KEY,SKILLSDROME_API_KEY=$$SKILLSDROME_API_KEY'
      - '--set-cloudsql-instances'
      - '$PROJECT_ID:us-central1:openassess-db'
    env:
      - 'GOOGLE_API_KEY=$_GOOGLE_API_KEY'
      - 'SECRET_KEY=$_SECRET_KEY'
      - 'SKILLSDROME_API_KEY=$_SKILLSDROME_API_KEY'

# Image to be deployed
images:
  - 'gcr.io/$PROJECT_ID/openassess-backend:$COMMIT_SHA'
